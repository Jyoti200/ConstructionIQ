name: Sync DPR and Material Data

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Delete existing database
        run: rm -f project.db

      - name: Build schema
        run: python schema.py

      - name: Run DPR loader
        env:
          DPR_SHEET_ID: ${{ secrets.DPR_SHEET_ID }}
          DPR_SHEET_GID: ${{ secrets.DPR_SHEET_GID }}
        run: python load_dpr.py --sheet-id "$DPR_SHEET_ID" --gid "$DPR_SHEET_GID"

      - name: Run Material loader
        env:
          MATERIAL_SHEET_ID: ${{ secrets.MATERIAL_SHEET_ID }}
        run: python material.py --sheet-id "$MATERIAL_SHEET_ID"

      - name: Commit and push updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
          git add project.db
      
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync data $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin main
          else
            echo "No changes to commit."
          fi
